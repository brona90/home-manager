name: CI

on:
  push:
    # Both branches listed for fork-friendliness (repo uses master)
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs: rapid pushes otherwise stack 60-min macOS jobs
# and can race two `:latest` docker pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fork-friendly: Use repository variables or fall back to defaults
# Forkers can set these in Settings → Secrets and variables → Actions → Variables
env:
  CACHIX_CACHE: ${{ vars.CACHIX_CACHE || 'gfoster' }}
  DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME || 'brona90' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      # Every linter below comes out of THIS flake's nixpkgs, via
      # packages.<system>.lint-tools. These steps used to be
      # `nix run nixpkgs#<tool>`, which resolves through the RUNNER's flake
      # registry -- a property of the machine, not of the repo -- so CI and a
      # local run silently got different versions of the same tool. PR #21
      # went red on it: shellcheck renumbered one finding (SC2329 in 0.11,
      # SC2317 earlier), modules/emacs/vanilla/verify.sh suppressed only the
      # newer code, and the registry served an older shellcheck than the
      # local profile had. verify.sh now resolves the same derivation, so the
      # two agree by construction. The `lint-tools-pinned` flake check guards
      # the regression.
      #
      # Cost of the change: this job now evaluates the flake, so it fetches
      # every input rather than just the registry's nixpkgs. That is the
      # price of the pin, it is paid once per job, and the `check` job pays
      # it anyway.
      - name: Build the pinned lint tools
        run: nix build .#lint-tools --out-link /tmp/lint-tools
      - name: Run statix
        run: /tmp/lint-tools/bin/statix check .
      - name: Run deadnix
        run: /tmp/lint-tools/bin/deadnix -f .
      - name: Check Nix formatting
        run: /tmp/lint-tools/bin/alejandra --check .
      - name: Shellcheck bootstrap.sh
        run: /tmp/lint-tools/bin/shellcheck bootstrap.sh
      - name: Actionlint workflows
        run: /tmp/lint-tools/bin/actionlint .github/workflows/*.yml
      # The CI-side twin of the `via <path> [<version>]` lines verify.sh
      # prints. The dereferenced store path names the exact derivation,
      # version included, and is the artefact to compare against a local run
      # the next time anyone suspects skew. Paths rather than `--version`
      # because statix has no --version flag at all.
      - name: Report the pinned linter store paths
        run: |
          for tool in statix deadnix alejandra shellcheck actionlint; do
            printf '%s -> %s\n' "$tool" "$(readlink -f "/tmp/lint-tools/bin/$tool")"
          done

  check:
    name: Flake Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            sandbox = false
      - uses: cachix/cachix-action@v17
        with:
          name: nix-community
          extraPullNames: emacs,${{ env.CACHIX_CACHE }}
      # `--all-systems` is back, and it took retiring Doom to get it.
      #
      # It was dropped because nix-doom-emacs-unstraightened uses
      # import-from-derivation and its intermediate derivations set
      # allowSubstitutes = false, so evaluating a Darwin config required
      # *building* Darwin derivations -- which a Linux runner cannot do
      # ("required system not available"). No Doom, no IFD. Verified rather
      # than assumed: `nix flake check --all-systems` exits 0 on x86_64-linux
      # against this flake.
      #
      # WHAT IT NOW COVERS, measured from the run log rather than assumed:
      # `nix flake check` walks apps, devShells, packages and checks. It does
      # not know about `homeConfigurations` -- that is not a standard flake
      # output -- but `perUserPackages` mirrors every one of them into
      # `packages.<system>.home-<username>`, and those ARE walked. A local
      # `--all-systems` run evaluated packages.x86_64-darwin.home-gfoster,
      # packages.aarch64-darwin.home-gfoster and
      # packages.aarch64-darwin.home-888973 on x86_64-linux. So Darwin home
      # configurations now get EVAL coverage from this job.
      #
      # eval-darwin below overlaps this job, deliberately and knowingly. That
      # question was settled rather than left open: the macOS runner it used to
      # require is gone (the job now runs on ubuntu-latest -- see the comment on
      # the job for the measurements that justified the move), but the job
      # itself was KEPT, for a reason this job cannot supply on its own.
      #
      # The Darwin coverage described above is INCIDENTAL. `flake check` has no
      # idea `homeConfigurations` exists; it reaches Darwin only because
      # `perUserPackages` happens to mirror each one into
      # `packages.<system>.home-<username>`. Gate or rename that mirroring and
      # Darwin coverage disappears from this job silently, with everything
      # still green. eval-darwin names the three configs from config.nix
      # outright, so that coverage is asserted rather than inherited.
      #
      # The retry loop that used to wrap this is gone with the same cause.
      # It existed because the IFD refetched every elisp source uncached --
      # from GitHub, GitLab and codeberg -- so any one host refusing a
      # connection failed the job over a change that touched nothing related.
      # PRs #20 and #21 both died within a minute of each other on
      #
      #   error: Failed to fetch git repository
      #          'https://gitlab.com/sawyerjgardner/demap.el.git'
      #
      # a package referenced nowhere in this repo, pulled in by Doom's module
      # set. This step now substitutes from the binary caches like everything
      # else and fetches nothing by hand. The retries on eval-darwin and
      # build-home STAY: both still cross the network -- build-home builds a
      # real closure, eval-darwin resolves a build plan against the
      # substituters -- and their flakiness was never Doom-specific.
      - name: Flake check
        run: nix flake check --all-systems
      # PR-time eval coverage for the Linux config. `nix build --dry-run`
      # evaluates and plans the build without building the final closure.
      - name: Evaluate Linux home configuration (dry-run)
        run: nix build --dry-run '.#homeConfigurations."gfoster@x86_64-linux".activationPackage'

  # PR-time evaluation coverage for all Darwin HOME CONFIGURATIONS declared in
  # config.nix. Runs on PRs too (unlike build-home), so a PR that breaks Darwin
  # eval can no longer merge green.
  #
  # THIS JOB NO LONGER RUNS ON macOS. That is the change, and this is why.
  #
  # It genuinely used to need a real Mac. nix-doom-emacs-unstraightened
  # resolved every elisp source through import-from-derivation, and those
  # intermediate derivations set `allowSubstitutes = false`, so merely
  # EVALUATING a Darwin config required *building* Darwin derivations -- which
  # a Linux runner cannot do ("required system not available"). That is the
  # whole reason this job was created on macos-14 instead of being a couple of
  # lines in the check job. Doom has since been retired: the input is gone from
  # flake.nix's `inputs` and does not appear in flake.lock at all. No IFD, no
  # constraint.
  #
  # MEASURED ON x86_64-linux BEFORE THE RUNNER WAS CHANGED, not assumed:
  #   * `nix eval .#packages.x86_64-darwin.home-gfoster.drvPath` returns a
  #     .drv (~13s of CPU) -- a Darwin activation package instantiates fully,
  #     transitively, on Linux.
  #   * `nix build --dry-run` of gfoster@aarch64-darwin exits 0 on Linux and
  #     resolves the complete ~1000-path build plan against the substituters.
  #     The `--dry-run` that was this job's stated reason to exist needs no Mac.
  #   * Breaking an assertion in home/darwin.nix on purpose made
  #     `nix flake check --all-systems` exit NONZERO on Linux, reporting
  #     against packages.x86_64-darwin. A Darwin-only break really does fail
  #     off-Mac; this was verified by injecting one, not by reading the docs.
  #
  # WHAT WENT WITH THE MAC, and why none of it was load-bearing:
  #   * `extra-platforms = x86_64-darwin` (Rosetta 2). That setting only
  #     affects BUILDING. This job only ever dry-runs, so Rosetta was
  #     buying it precisely nothing.
  #   * `stalled-download-timeout`, which was there for macOS closure copies.
  #     A dry-run downloads no closure.
  #   * "on a real Darwin builder". With no IFD anywhere in the flake,
  #     evaluating for a target `system` is host-independent. And if IFD is
  #     ever reintroduced, this job now fails LOUDLY on Linux -- which is the
  #     signal you want. A Mac would have absorbed it in silence and let the
  #     regression through.
  #
  # BEFORE YOU DELETE OR RENAME THIS JOB: `Evaluate Darwin Configurations`
  # (the `name:` below, which is the string GitHub reports as the status
  # context) is a REQUIRED STATUS CHECK on master, alongside `Lint` and
  # `Flake Check`. If it stops reporting, every PR waits forever on a check
  # that will never arrive and nothing can merge. Drop the context from branch
  # protection FIRST, then merge the removal -- never the other way round.
  eval-darwin:
    name: Evaluate Darwin Configurations
    runs-on: ubuntu-latest
    needs: lint
    # Was 60 when this copied Darwin closures onto a macOS runner. It is now an
    # evaluation plus a substituter query -- ~2 min on a busy local box. 30
    # leaves headroom for a cold runner without hiding a hang for an hour.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            sandbox = false
            connect-timeout = 30
            download-attempts = 5
      - uses: cachix/cachix-action@v17
        with:
          name: nix-community
          extraPullNames: emacs,${{ env.CACHIX_CACHE }}
      # Retried through the composite action, which build-home shares. The
      # original reason was the unstraightened IFD's uncached elisp fetches,
      # and that is gone with Doom. The retry stays anyway: `--dry-run` still
      # resolves a build plan against cache.nixos.org, and a transient 408
      # there fails the job over a change that touched nothing related.
      - name: Evaluate Darwin home configurations (dry-run)
        uses: ./.github/actions/nix-build-retry
        with:
          nix-args: --dry-run
          targets: |
            .#homeConfigurations."gfoster@x86_64-darwin".activationPackage
            .#homeConfigurations."gfoster@aarch64-darwin".activationPackage
            .#homeConfigurations."888973@aarch64-darwin".activationPackage

  build-home:
    name: Build Home Configurations
    runs-on: ${{ matrix.runner }}
    needs: [check, eval-darwin]
    # Cap at 60 min so a stuck build (e.g. a byte-trickle closure copy on macOS-14)
    # surfaces fast instead of bleeding the GitHub Actions 6h job timeout.
    timeout-minutes: 60
    # There is deliberately NO job-level `if` here. It used to read
    #   if: github.event_name == 'push' && (github.ref == 'refs/heads/main' ...)
    # which made this job report "skipping" on EVERY pull request (observed on
    # PR #14: Lint/Flake Check/Evaluate Darwin green, Build Home Configurations
    # skipped). Nothing in CI built the Linux closure before merge, so a local
    # `nix build` was the only thing between a broken home configuration and
    # master. The matrix below is event-dependent instead of the whole job.
    strategy:
      # One config's transient failure (e.g. a 503 from a package host)
      # must not cancel the sibling builds.
      fail-fast: false
      # PRs build the Linux configuration ONLY; a push to main/master builds
      # everything. That is the cheapest thing that still catches a broken
      # Linux build: ubuntu runners are the cheap ones, macOS bills at 10x,
      # and the Darwin configs already get PR-time EVAL coverage from
      # eval-darwin -- eval is what actually breaks on a config change, and a
      # Darwin-only *build* failure is caught on push, before any Mac
      # switches to it.
      #
      # gfoster@x86_64-darwin is absent from both lists: GitHub has no hosted
      # gfoster@x86_64-darwin is absent from both lists: GitHub has no hosted
      # Intel macOS runners anymore. It keeps eval-only coverage via
      # eval-darwin, which no longer needs a Mac (nor the Rosetta
      # `extra-platforms` it used to lean on) to evaluate it.
      #
      # A dynamic matrix, not a job `if`, because `jobs.<id>.if` cannot see
      # the matrix context and a per-entry `if` does not exist -- spinning up
      # two macOS runners just to skip their steps is what that would cost.
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'push'
          && '[{"config":"gfoster@x86_64-linux","runner":"ubuntu-latest"},{"config":"gfoster@aarch64-darwin","runner":"macos-14"},{"config":"888973@aarch64-darwin","runner":"macos-14"}]'
          || '[{"config":"gfoster@x86_64-linux","runner":"ubuntu-latest"}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            sandbox = false
            # Mac runs were hanging 50+ min on stalled cache.nixos.org pulls
            # (e.g. haskell-language-server). Default stalled-download-timeout
            # is 300s; a slow trickle download below the stall threshold can
            # bleed the whole 60min job. Tighter values + download-attempts
            # force a retry that may pick a healthier mirror.
            stalled-download-timeout = 60
            connect-timeout = 30
            download-attempts = 5

      # This job PUSHES to cachix (has authToken). skipPush disables the
      # action's post-run drain, which FAILS the whole job when a single
      # upload stalls past its timeout (first seen with a large fresh Emacs
      # closure). The explicit best-effort push step below replaces it: a
      # cache push must never fail CI after a successful build.
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,emacs
          skipPush: true

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      # Retried, exactly like eval-darwin: this job builds a full closure over
      # the network, so a GitHub or cache.nixos.org 408 mid-build fails a push
      # that was otherwise fine. The rationale lives with the action.
      # nix-args: -L (print-build-logs) so a hanging derivation surfaces its
      # actual build phase output instead of "building '...drv'..." silence.
      - name: Build home configuration
        uses: ./.github/actions/nix-build-retry
        with:
          nix-args: -L
          targets: .#homeConfigurations."${{ matrix.config }}".activationPackage

      - name: Push closure to Cachix (best effort)
        # Never fail CI over a cache upload; the build already succeeded.
        continue-on-error: true
        # Only push paths NOT already signed by cache.nixos.org — pushing the
        # raw closure uploads thousands of upstream paths for nothing.
        # `nix path-info --json` output shape differs across nix versions:
        # nix >= 2.19 emits an object keyed by store path, older versions an
        # array of {path, ...} objects; the jq below normalizes both.
        run: |
          nix path-info -r ./result --json | jq -r '
            (if type == "object" then to_entries | map(.value + {path: .key}) else . end)
            | .[]
            | select(((.signatures // []) | map(startswith("cache.nixos.org")) | any) | not)
            | .path' \
            | tee /tmp/cachix-paths.txt \
            | cachix push "${{ env.CACHIX_CACHE }}"
          echo "Pushed $(grep -c . /tmp/cachix-paths.txt || true) paths not already signed by cache.nixos.org"

      # THE EMACS GATE -- the only CI step that ever starts Emacs.
      #
      # WHY A DAEMON AND NOT `emacs --batch`: batch does NOT load init.el at
      # all, so a batch run reports success while having loaded nothing. That
      # is exactly how six leader keys reached master bound to void commands
      # (fixed in PR #15) with every CI job green. verify.sh starts a REAL
      # daemon from the store configDir, walks the actual leader keymap and
      # asserts fboundp on every command it reaches. If anyone ever "speeds
      # this up" by switching it to --batch, the check is gone and the job
      # will keep saying PASS. See modules/emacs/vanilla/verify.sh.
      #
      # Linux only: packages.emacs-vanilla is Linux-gated in flake.nix.
      #
      # In THIS job rather than one of its own because verify.sh builds the
      # activation package as one of its stages: here that is a store hit
      # from the step above, whereas a dedicated runner would rebuild the
      # whole home closure a second time. Placed after the Cachix push so a
      # red gate still leaves the closure cached.
      - name: Emacs vanilla gate (real daemon, not batch mode)
        if: matrix.config == 'gfoster@x86_64-linux'
        run: bash modules/emacs/vanilla/verify.sh

  docker-build:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: build-home  # Run after home configs cached
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    # Only run on push to main/master (not PRs)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            sandbox = false

      # Read-only: pull from caches but don't push (Docker images bloat cachix)
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          extraPullNames: nix-community,emacs
      
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
      
      - name: Generate image tag
        id: tag
        run: echo "tag=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      
      - name: Build Docker image
        run: |
          # Streamed variant: pipes layers straight into the docker daemon.
          # The tar.gz dockerImage blew the runner's disk during layer
          # assembly (closure + tar scratch + archive simultaneously).
          nix build .#dockerImageStream
          ./result | docker load

      # Smoke test runs against the locally loaded image BEFORE any push,
      # so a broken image never reaches Docker Hub.
      - name: Smoke test image (pre-push)
        run: |
          IMAGE="${{ env.DOCKER_USERNAME }}/terminal:latest"

          echo "=== Testing tools exist and are executable ==="
          docker run --rm "$IMAGE" zsh -c "
            set -euo pipefail
            check() { local tool=\$1; shift; \$tool \"\$@\" >/dev/null 2>&1 && echo \"✓ \$tool\" || { echo \"✗ \$tool FAILED\"; exit 1; }; }
            check tmux -V
            check emacs --version
            check starship --version
            check mise --version
            check fzf --version
            check rg --version
            check fd --version
            check bat --version
            check btop --version
            check git --version
            check zsh --version
          "

          echo "=== Testing interactive shell loads ==="
          docker run --rm "$IMAGE" zsh -i -c "echo 'Shell loaded successfully'"

          echo "=== All smoke tests passed ==="

      - name: Push to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::notice::Skipping Docker Hub push - DOCKERHUB_TOKEN not configured"
            echo "To enable Docker push, add DOCKERHUB_TOKEN secret in repository settings"
            exit 0
          fi

          IMAGE="${{ env.DOCKER_USERNAME }}/terminal"

          echo "$DOCKERHUB_TOKEN" | docker login -u "${{ env.DOCKER_USERNAME }}" --password-stdin
          docker tag "$IMAGE:latest" "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$IMAGE_TAG"

          echo "::notice::Pushed $IMAGE:$IMAGE_TAG and $IMAGE:latest"

  # Registry-pull verification only — the real gate is the pre-push smoke
  # test in docker-build. This confirms the pushed artifact is pullable
  # and runnable from Docker Hub.
  docker-test:
    name: Verify Pushed Docker Image
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Pull and verify pushed image
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.docker-build.outputs.image_tag }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            {
              echo "## Docker registry verification"
              echo ""
              echo "**Skipped — no DOCKERHUB_TOKEN configured.** No image was pushed."
              echo "The image was still built and smoke-tested locally in the docker-build job."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Registry verification skipped - DOCKERHUB_TOKEN not configured, no image was pushed"
            exit 0
          fi

          IMAGE="${{ env.DOCKER_USERNAME }}/terminal:$IMAGE_TAG"

          echo "Pulling image: $IMAGE"
          docker pull "$IMAGE"

          echo "=== Verifying pulled image runs ==="
          docker run --rm "$IMAGE" zsh -i -c "echo 'Shell loaded successfully'"

          {
            echo "## Docker registry verification"
            echo ""
            echo "Pulled and ran \`$IMAGE\` successfully."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "=== Registry verification passed ==="
