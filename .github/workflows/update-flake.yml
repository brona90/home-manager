name: Update flake.lock

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  issues: write # unpin-tracker step comments on the tracking issue

# Same group key as ci.yml and validate.yml, but runs QUEUE instead of
# cancelling. Two overlapping runs (the Sunday cron plus a manual dispatch)
# would both force-update the one update-flake-lock PR branch and race on
# auto-merge; cancelling the older one mid-run could stop it after it pushed
# that branch but before it enabled auto-merge, leaving the PR parked.
# Waiting costs one extra run, nothing more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Fork-friendly: Use repository variables or fall back to defaults
env:
  CACHIX_CACHE: ${{ vars.CACHIX_CACHE || 'gfoster' }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            sandbox = false

      - uses: cachix/cachix-action@v17
        with:
          name: nix-community
          extraPullNames: emacs,${{ env.CACHIX_CACHE }}

      # Update the lock first and validate it BEFORE any PR is created, so the
      # update is checked even when no PAT is configured (see token note below).
      - name: Update flake.lock
        run: nix flake update

      # Unpin tracker for the `nixpkgs-mise` input in flake.nix. That input
      # sources mise from rev 8c3cede7 on aarch64-darwin only, because the
      # channel's mise (2026.6.11 at the time) fails its own Rust test suite
      # on macOS and so breaks the Darwin home build (8eb7e7d).
      #
      # This step used to watch for nixpkgs commit 95e9e11e, the darwin emacs
      # 30.2 fix. That tracked an EARLIER whole-nixpkgs pin at the same rev
      # (7acb28c), which 0e55054 removed and whose tracking issue #1 is
      # closed; the mise pin that came next reused the rev but not the
      # reason, and the check went on watching a condition met long ago.
      #
      # The real condition is "the channel's darwin mise builds again". Hydra
      # pushes an output to cache.nixos.org only when its build -- tests
      # included -- succeeded, so the mise of the nixpkgs rev just locked
      # being substitutable is that condition, observed. Absent means
      # "not shown yet" (it may simply not be built), so the pin stays.
      # Best effort: must never fail the workflow.
      - name: Check whether the nixpkgs-mise pin can be removed
        continue-on-error: true
        env:
          # github.token (not FLAKE_UPDATE_TOKEN): the fine-grained PAT has no
          # Issues permission, and issue comments don't need to trigger CI.
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_TITLE="Unpin nixpkgs-mise once channel mise builds on aarch64-darwin"
          MARKER="<!-- nixpkgs-mise-unpin-ready -->"

          REV=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          MISE="github:NixOS/nixpkgs/${REV}#legacyPackages.aarch64-darwin.mise"
          OUT=$(nix eval --raw "${MISE}.outPath")
          VERSION=$(nix eval --raw "${MISE}.version")
          HASH=$(basename "$OUT" | cut -d- -f1)
          echo "channel mise at ${REV}: ${VERSION} (${OUT})"
          if ! curl -sfI "https://cache.nixos.org/${HASH}.narinfo" >/dev/null; then
            echo "Channel mise ${VERSION} is not in cache.nixos.org for aarch64-darwin; keeping the pin."
            exit 0
          fi
          echo "::notice::Channel mise ${VERSION} built on aarch64-darwin; the nixpkgs-mise pin in flake.nix can be removed."

          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$ISSUE_TITLE\" in:title" \
            --json number --jq '.[0].number // empty' || true)
          if [ -z "$ISSUE" ]; then
            echo "No open tracking issue titled '$ISSUE_TITLE'; the notice above is the only signal."
            exit 0
          fi

          # Comment only once: skip if a previous run already pinged the issue.
          if gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --json comments --jq '.comments[].body' | grep -qF "$MARKER"; then
            echo "Issue #$ISSUE already notified; skipping."
            exit 0
          fi

          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$MARKER
          The channel's aarch64-darwin mise (\`${VERSION}\`, nixpkgs \`${REV}\`) is in cache.nixos.org, so Hydra built it with its tests passing. The \`nixpkgs-mise\` input and \`pinMiseOnDarwin\` overlay in \`flake.nix\` can be removed."

      # `--all-systems` is back. It was omitted while the unstraightened
      # (Doom Emacs) IFD derivations set allowSubstitutes = false, which made
      # evaluating Darwin configs require BUILDING Darwin derivations on this
      # Linux runner. Doom is retired; verified exiting 0 before this changed.
      #
      # This is the job that gains most from it. `nix flake check` does not know
      # about `homeConfigurations`, but `perUserPackages` mirrors each one into
      # `packages.<system>.home-<username>`, and `--all-systems` walks those --
      # so an unattended weekly lock bump that breaks only the Darwin
      # configuration is now caught HERE, before the PR is opened, instead of
      # relying on ci.yml's eval-darwin firing (which needs FLAKE_UPDATE_TOKEN,
      # see below) on a PR that may never get CI at all.
      - name: Validate updated flake
        run: |
          nix flake check --all-systems
          nix build --dry-run '.#homeConfigurations."gfoster@x86_64-linux".activationPackage'

      # GITHUB_TOKEN trap: PRs created with the default workflow token do NOT
      # trigger any `pull_request` workflows, so flake-update PRs would get
      # zero CI. Add a fine-grained PAT (contents: read/write, pull-requests:
      # read/write on this repo) as the FLAKE_UPDATE_TOKEN repo secret so the
      # created PR fires CI like a human-opened one. Falls back to the default
      # token when unset (PR is still created, but relies on the validation
      # step above). See .github/SETUP.md for setup instructions.
      - uses: DeterminateSystems/update-flake-lock@v29
        id: update-flake
        with:
          token: ${{ secrets.FLAKE_UPDATE_TOKEN || github.token }}
          pr-title: "flake.lock: update inputs"
          pr-labels: |
            dependencies
            automated

      # Auto-merge: once the PR's required checks (Lint, Flake Check,
      # Evaluate Darwin Configurations — enforced via branch protection on
      # master) pass, GitHub squash-merges it without human intervention.
      # Guarded twice:
      #   - step `if`: skip when the action created/updated no PR this run
      #   - in-script: skip without failing when FLAKE_UPDATE_TOKEN is absent.
      #     A GITHUB_TOKEN-created PR triggers no CI, so its required checks
      #     would never report and auto-merge would just sit pending anyway.
      - name: Enable auto-merge on the flake-update PR
        if: >-
          steps.update-flake.outputs.pull-request-number != '' &&
          (steps.update-flake.outputs.pull-request-operation == 'created' ||
           steps.update-flake.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN }}
          PR_URL: ${{ steps.update-flake.outputs.pull-request-url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::FLAKE_UPDATE_TOKEN not configured — skipping auto-merge for $PR_URL"
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
          echo "Auto-merge (squash) enabled on $PR_URL"
